[project]
name = "urban-dollop"
description = "Urban freight simulation based on the MASS-GT multi-agent model"
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = "GPL-2.0-only"
authors = [
  { name = "hcubasd", email = "127428549+hcubasd@users.noreply.github.com" },
]
urls = { Repository = "https://github.com/hcubasd/urban-dollop" }
dependencies = ["pandas>=3.0", "geopandas>=1.1.3", "scipy>=1.17.1", "shapely>=2.1.2"]
dynamic = ["version"]

[project.scripts]
urban-dollop = "urban_dollop.cli.main:main"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
